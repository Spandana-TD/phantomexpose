version: "3.9"

services:
  # ---------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: phantomexpose-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: phantomexpose-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: phantomexpose-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: phantomexpose-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: phantomexpose-super-secret-key-change-in-production-min-256-bits
    ports:
      - "8081:8081"

  consumer-service:
    build: ./services/consumer-service
    container_name: consumer-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
    ports:
      - "8082:8082"

  meter-reading-service:
    build: ./services/meter-reading-service
    container_name: meter-reading-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKER: kafka:9092
    ports:
      - "8083:8083"

  detection-service:
    build: ./services/detection-service
    container_name: detection-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      consumer-service:
        condition: service_started
      meter-reading-service:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKER: kafka:9092
    ports:
      - "8084:8084"

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKER: kafka:9092
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: phantomexpose@example.com
      SMTP_PASSWORD: changeme
    ports:
      - "8085:8085"

  analytics-service:
    build: ./services/analytics-service
    container_name: analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      detection-service:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
    ports:
      - "8086:8086"

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    depends_on:
      - auth-service
      - consumer-service
      - meter-reading-service
      - detection-service
      - notification-service
      - analytics-service
      - redis
    environment:
      REDIS_HOST: redis
      JWT_SECRET: phantomexpose-super-secret-key-change-in-production-min-256-bits
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: phantomexpose-frontend
    depends_on:
      - api-gateway
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"

volumes:
  pg-data:
